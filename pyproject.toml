[project]
name = "ddd-learning-challenges"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "black>=25.0",
    "pre-commit>=4.0",
    "pytest>=8.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["src/python"]
testpaths = ["test"]
